# 接触式吸顶决策参数
# 单位约定：距离=m，时间=s，速度=m/s，角度=deg，推力=0~1归一化值。
# 当前数值是台架测试初值，不是可直接用于真机的最终参数。

ceiling_attachment_decision_node:
  # ===========================================================================
  # 1. ROS接口
  # 台架测试使用 /mock_mavros/local_position/odom；连接飞控后再改成
  # /mavros/local_position/odom。
  # ===========================================================================
  range_topic: /sensor/ceiling/range
  odom_topic: /mock_mavros/local_position/odom
  state_topic: /mavros/state
  operator_topic: /operator/command
  detach_topic: /ceiling_attachment/detach
  status_topic: /ceiling_attachment/status
  control_candidate_topic: /ceiling_attachment/control_candidate
  publish_rate_hz: 50.0

  # ===========================================================================
  # 2. 机械结构与距离标定（最先修改）
  # contact_distance_m：机构刚接触天花板时，雷达实际读数 d0。
  # target_compression_m：期望压缩量；目标顶距=d0-target_compression_m。
  # activation_distance_m：小于该距离后，开始自动接近。
  # contact_margin_m：允许从 APPROACH 进入接触控制的额外距离裕量。
  # lost_contact_margin_m：贴顶时顶距大于 d0+该值，判定接触丢失并脱离。
  # 必须满足：0 < target_compression_m < contact_distance_m
  #           contact_distance_m + contact_margin_m < activation_distance_m
  # ===========================================================================
  contact_distance_m: 0.10
  target_compression_m: 0.02
  activation_distance_m: 0.50
  contact_margin_m: 0.02
  lost_contact_margin_m: 0.08

  # ===========================================================================
  # 3. 传感器滤波与输入超时
  # 一阶低通：filtered += alpha * (raw-filtered)。alpha越小越平滑但延迟越大。
  # L1普通连续测量约5~8Hz，当前0.60s允许短暂丢帧；真机应按实测频率调整。
  # ===========================================================================
  range_filter_alpha: 0.20
  range_timeout_s: 0.60
  odom_timeout_s: 0.50
  # nav_msgs/Odometry.twist is expressed in child_frame_id by convention.
  odom_twist_in_child_frame: true
  state_timeout_s: 1.50
  operator_timeout_s: 0.50
  require_armed: true
  require_offboard: true

  # ===========================================================================
  # 4. 进入条件与姿态保护
  # ===========================================================================
  max_roll_deg: 15.0
  max_pitch_deg: 15.0

  # ===========================================================================
  # 5. 靠近阶段
  # 进入 APPROACH 后先等待 approach_settle_time_s，再以固定速度向上靠近。
  # 超过 approach_timeout_s 未接触则锁存 FAULT，由模式管理器交回 POSCTL。
  # 控制台分支单帧顶距达到 wall_contact_distance_m 后直接进入保持。
  # ===========================================================================
  approach_settle_time_s: 0.50
  approach_speed_mps: 0.15
  approach_timeout_s: 12.0

  # ===========================================================================
  # 6. 接触确认与稳定判定
  # 控制台分支：单帧有效原始顶距 <= 0.067m，直接进入 SURFACE_HOLD。
  # 普通分支：压缩量 >= attach_confirm_compression_m，并持续 attach_confirm_time_s。
  # ===========================================================================
  wall_contact_distance_m: 0.067
  attach_control_time_s: 0.50
  # 接触后若距离仍未进入稳定区间，最多尝试该时长，然后受控脱离。
  attach_control_timeout_s: 5.00
  require_attach_confirmation: true
  attach_confirm_compression_m: 0.015
  attach_confirm_time_s: 0.30
  stable_tolerance_m: 0.01
  stable_time_s: 0.50

  # ===========================================================================
  # 7. 接触/贴顶推力候选
  # 接触推力从 hover_thrust*attach_thrust_multiplier 开始；若顶部距离仍大于
  # 稳定目标区间，则按 attach_thrust_ramp_per_s 递增，最高到
  # attach_max_thrust。进入稳定距离区间后停止增加。
  # 保持推力=hover_thrust*surface_thrust_multiplier
  # 所有推力最终仍受 max_thrust 限制。
  # ===========================================================================
  # 2026-10-13 根据机载日志复核，用户指定悬停基值 0.49；仍需悬停验证。
  # HOLD超过该时长仍未开始DETACH，进入ABORT并请求PX4 AUTO.LAND。
  hold_timeout_s: 5.0
  hover_thrust: 0.49
  attach_thrust_multiplier: 1.11
  surface_thrust_multiplier: 1.07
  attach_thrust_ramp_per_s: 0.02
  attach_max_thrust: 0.55
  max_thrust: 0.90

  # ===========================================================================
  # 8. 脱离阶段距离PID候选
  # 脱离目标距离从压缩目标缓慢增加到独立安全分离距离。
  # detach_timeout_s 防止距离始终达不到安全分离阈值而卡在 DETACH。
  # ===========================================================================
  detach_safe_distance_m: 0.30
  detach_clear_hold_s: 0.20
  detach_min_thrust: 0.30
  detach_distance_ramp_mps: 0.08
  distance_kp: 1.0
  distance_ki: 0.0
  distance_kd: 0.0
  integral_limit: 1.0
  detach_timeout_s: 5.0
  recovery_hover_time_s: 2.0

  # 真实机构驱动必须对相同 sequence 回复 acknowledged+released。
  mechanism_candidate_topic: /attachment/mechanism_candidate
  mechanism_status_topic: /attachment/mechanism_status
  require_mechanism_ack: true
  mechanism_timeout_s: 1.0

  # POSCTL capture and free-flight stabilization (ENU). Limits are initial values.
  motion_control_enabled: true
  detach_fused_height_enabled: true
  odom_vertical_jump_m: 0.25
  rc_manual_coordination_enabled: true
  rc_manual_position_weight: 0.25
  rc_manual_blend_s: 0.50
  rc_manual_feedback_timeout_s: 0.20
  rc_manual_zero_deg: 0.05
  horizontal_position_deadband_m: 0.1
  horizontal_position_kp: 0.3
  horizontal_max_speed_mps: 0.2
  horizontal_velocity_kp: 1.5
  horizontal_velocity_ki: 0.3
  horizontal_integral_limit_mps2: 0.2
  horizontal_max_acceleration_mps2: 0.4
  horizontal_target_acceleration_mps2: 0.1
  horizontal_drift_warn_m: 0.3
  horizontal_drift_pause_m: 0.5
  horizontal_drift_resume_m: 0.3
  attitude_max_tilt_deg: 10.0
  contact_max_tilt_deg: 5.0
  yaw_max_offset_deg: 10.0
  attitude_tilt_slew_deg_s: 15.0
  attitude_yaw_slew_deg_s: 15.0
  actual_tilt_pause_deg: 15.0
  actual_tilt_resume_deg: 12.0
  actual_body_rate_pause_deg_s: 30.0
  actual_body_rate_resume_deg_s: 20.0
  motion_limit_confirm_s: 0.2
  motion_resume_hold_s: 0.5
  motion_feedback_timeout_s: 2.0
  motion_pause_timeout_s: 8.0
  motion_flow_timeout_s: 0.6
  motion_flow_future_tolerance_s: 0.1
  motion_flow_quality_min: 1.0
  motion_estimator_timeout_s: 1.5
  motion_reacquire_time_s: 0.3
  motion_equilibrium_window_s: 0.5
  motion_equilibrium_speed_mps: 0.2
  motion_fcu_target_timeout_s: 0.35
  motion_capture_timeout_s: 2.0
  vertical_speed_kp: 0.3
  vertical_target_acceleration_mps2: 0.15
  detach_min_down_speed_mps: 0.05
  recovery_height_kp: 0.5
  recovery_height_tolerance_m: 0.05
  recovery_vertical_speed_mps: 0.15
  recovery_horizontal_speed_mps: 0.15
  recovery_max_tilt_deg: 10.0
  recovery_max_rate_deg_s: 20.0
  recovery_stable_time_s: 0.5
  recovery_timeout_s: 15.0
  contact_release_distance_m: 0.1
  contact_release_hold_s: 0.2
  odom_position_jump_m: 0.75
  odom_yaw_jump_deg: 20.0
