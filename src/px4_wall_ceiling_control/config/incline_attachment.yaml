# Independent incline profile, executed by wall_perch_decision_node on the
# existing wall transport. No second MAVROS setpoint publisher is started.
incline_attachment:
  enabled: false
  # Required calibration: replace 0 with a verified cap, then enable explicitly.
  # Must exceed the captured approach thrust and not exceed the global mux cap.
  flip_thrust_max: 0.0
  front_ready_distance_m: 0.50
  front_ready_hold_s: 0.40
  flip_trigger_distance_m: 0.10
  top_contact_distance_m: 0.065
  horizontal_approach_speed_mps: 0.10
  approach_timeout_s: 20.0
  flip_max_tilt_deg: 65.0
  flip_pitch_rate_deg_s: 10.0
  flip_pitch_accel_deg_s2: 10.0
  flip_max_tracking_error_deg: 10.0
  flip_duration_timeout_s: 8.0
  flip_thrust_ramp_per_s: 0.03
  top_contact_hold_s: 0.20
  contact_settle_timeout_s: 1.0
  contact_attitude_tolerance_deg: 5.0
  contact_max_rate_deg_s: 10.0
  hold_entry_blend_s: 0.50
  hold_contact_loss_margin_m: 0.015
  hold_contact_loss_hold_s: 0.30
  detach_max_rate_deg_s: 30.0
  detach_max_accel_deg_s2: 30.0
  detach_max_tracking_error_deg: 10.0
  detach_duration_timeout_s: 10.0
  detach_brake_target_deg: 30.0
  detach_brake_decel_deg_s2: 30.0
  detach_brake_delay_s: 0.15
  detach_brake_margin_deg: 5.0
  detach_recovered_tilt_deg: 5.0
  detach_recovered_rate_deg_s: 10.0
  detach_recovered_hold_s: 0.30
  return_thrust_slew_per_s: 0.20
  recovery_hold_s: 1.0
  recover_timeout_s: 15.0
  recovery_max_speed_mps: 0.20
  recovery_max_height_error_m: 0.10
  height_kp: 0.30
  velocity_kp: 0.30
