# No mission/waypoint/geofence/rallypoint synchronization in the attachment console.
# This only disables MAVROS clients; it does not disable PX4 internal geofencing.
plugin_blacklist:
- safety_area
- image_pub
- vibration
- distance_sensor
- rangefinder
- wheel_odometry
- waypoint
- geofence
- rallypoint
plugin_whitelist: []
