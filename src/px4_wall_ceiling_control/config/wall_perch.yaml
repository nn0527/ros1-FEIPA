# 外部 PX4 贴墙参考模块 wall_perch 的 ROS 移植配置。以下参数为
# 台架测试初始值，增益和限幅尚未通过飞行验证。
wall_perch_decision_node:
  decision_enabled: false

  front_range_topic: /sensor/front/range
  top_range_topic: /sensor/ceiling/range
  sensor_health_topic: /sensor/health
  odom_topic: /mavros/local_position/odom
  state_topic: /mavros/state
  operator_topic: /operator/command
  detach_topic: /wall_perch/detach
  cancel_topic: /wall_perch/cancel
  status_topic: /wall_perch/status
  control_candidate_topic: /wall_perch/control_candidate
  publish_rate_hz: 50.0

  # 对应 PX4 前向距离就绪阈值／保持时间：WP_FRN_RD_DIST / WP_FRN_RD_HLD
  front_ready_distance_m: 0.50
  # 前距连续满足0.4 s后直接进入SLOW_APPROACH。
  front_ready_hold_s: 0.40
  # 一帧新鲜有效的原始前距≤0.20 m即可翻转；0表示单帧，不经过距离滤波或连续确认。
  flip_trigger_distance_m: 0.20
  flip_trigger_hold_s: 0.0
  # 对应 PX4 顶部接触距离／保持时间：WP_TOP_CT_DIST / WP_TOP_CT_HLD
  top_contact_distance_m: 0.056
  # 旧顶部准入判断仅保留作诊断；顶部距离、有效帧和新鲜度均不参与HOLD准入。
  hold_entry_top_distance_check_enabled: false
  # 翻转轨迹完成且实测俯仰角≥80°才进入HOLD，否则进入CAPTURE等待。
  hold_entry_min_pitch_deg: 80.0
  # 保留为HOLD后的接触诊断；进入HOLD不再等待连续近距确认。
  top_contact_hold_s: 1.00
  top_clear_distance_m: 0.10
  top_clear_hold_s: 0.50
  # 翻转后顶部雷达成为贴墙压力反馈：距离偏大时增推，恢复后回到名义保持值。
  wall_pressure_target_distance_m: 0.05
  wall_pressure_tolerance_m: 0.01

  # 正常流程跳过STABILIZE_HOVER；保留参数仅用于旧状态兼容。
  stabilize_time_s: 0.00
  # 有效的前向原始距离超过此阈值时，中止翻转前的接近过程。
  approach_abort_front_distance_m: 1.8
  approach_timeout_s: 20.00
  flip_time_s: 2.00
  # 独立的实际经过时间上限：控制步长受限，停顿后不会通过补步追赶轨迹。
  flip_duration_timeout_s: 6.00
  # 限制目标姿态领先于新鲜实测姿态的角度；高度制动仍保持启用。
  flip_max_tracking_error_deg: 15.0
  # 最后10%才接入顶部雷达用于诊断和压墙反馈，不参与HOLD准入。
  flip_top_start_fraction: 0.90
  capture_time_s: 0.50
  # 翻转完成但实测俯仰角不足80°时，最多等待8秒；安全输入失效仍立即中止。
  capture_timeout_s: 8.00
  # 持续贴墙，直到操作员停止车轮并请求脱离。
  hold_time_s: 0.00
  # 滑移或车轮修正期间维持受限的压墙推力；只有收到人工脱离请求，
  # 且通过正常的姿态／角速度稳定性检查后，才继续脱离流程。
  # 仅在轨迹完成且实测俯仰角达到准入条件后启用。
  manual_wall_recovery_enabled: true
  hold_entry_blend_s: 0.50
  # 测距离墙 demo：新鲜姿态、权限和最终输出满足就开始，不等待稳定窗口。
  # 以下轴误差、速率及稳定等待参数仅供非测距兼容路径。
  # 轨迹从最后一次实际发布的姿态／推力开始。
  detach_axis_error_deg: 15.0
  detach_max_rate_rps: 0.436332313  # 25 度／秒
  detach_vertical_speed_check_enabled: false  # 脱离准入时不检查速度大小。
  detach_max_abs_vertical_speed_mps: 0.20
  detach_stable_hold_s: 0.50
  detach_request_timeout_s: 8.00
  # 脱离姿态轨迹的规划时长。
  # 名义90度五次曲线时长3秒；接入动态制动后允许延长，以实际规划完成为准。
  detach_time_s: 3.00
  detach_duration_timeout_s: 10.00
  detach_max_tracking_error_deg: 30.0
  # 测距与非测距正常离墙均启用以下动态制动；专用台架保留定时轨迹。
  # 第一段目标与实测不匹配时按跟踪误差门等待；第二段实测倾角≤30度锁存制动，
  # 继承最终已发布目标的角度/速度/加速度重新插值，结合实测姿态和角速度。
  # 制动能力是规划假设，需台架/试飞验证；此处不修改PX4角速度积分。
  detach_brake_enabled: true
  detach_brake_target_deg: 30.0
  detach_brake_decel_deg_s2: 30.0
  detach_brake_delay_s: 0.15
  detach_brake_margin_deg: 5.0
  detach_brake_max_lead_deg: 10.0
  detach_brake_target_rate_deg_s: 56.25
  detach_brake_target_accel_deg_s2: 180.0
  detach_brake_attitude_gain: 4.0
  detach_brake_rate_damping: 1.0
  detach_recovered_tilt_deg: 5.0
  detach_recovered_rate_deg_s: 10.0
  detach_recovered_hold_s: 0.30
  recover_time_s: 1.00
  recover_timeout_s: 15.00
  # 测距脱离：锁定前仅姿态推力支撑；锁定后才建立测距高度目标。
  # 以下旧竖直环参数仅供非测距兼容路径；测距速度环另有独立增益。
  detach_height_kp: 0.30
  detach_velocity_kp: 0.30
  detach_velocity_ki: 0.06
  detach_vertical_integral_limit: 0.06
  detach_vertical_correction_limit: 0.12
  detach_support_max_thrust: 0.85
  # 仅飞行控制台选择启用雷达测距高度控制；其他入口保留
  # 原有垂直控制环。必须核实硬件安装。
  detach_range_height_enabled: false
  detach_range_entry_tilt_deg: 10.0
  # 首次锁定仍需10度；锁定后允许摆动，仅保留接近水平光轴的几何保护。
  detach_range_operating_tilt_deg: 60.0
  detach_range_timeout_s: 0.60
  # 优先按源时间插值；没有前后帧时允许时间差≤0.10秒的最近姿态。
  detach_range_pose_interp_max_span_s: 0.10
  detach_range_pose_wait_s: 0.20
  detach_range_velocity_window_s: 0.8
  detach_range_velocity_min_dt_s: 0.05
  detach_range_height_only_kp: 0.15
  # 仅用于雷达测距的速度环候选增益；旧路径及非雷达路径的增益保持不变。
  # 快速反馈暴露出修正量频繁饱和后，由原来的 0.30 下调。
  detach_range_control_velocity_kp: 0.10
  # 兼容诊断字段：demo直接使用限幅及推力变化率，不再叠加反馈接入权重。
  detach_range_control_blend_s: 0.30
  # 真正失去新鲜高度后最多支撑2秒；缺少测距速度不会触发故障。
  detach_range_loss_support_s: 2.00
  # 以下总时间预算和交接预算保留配置兼容，demo不据此中断回平或高度保持。
  detach_range_control_timeout_s: 15.0
  detach_range_handover_wait_s: 6.0
  # 以下为兼容路径阈值；简化版锁定姿态RECOVER统一使用 domain/simple_recovery.py：
  # 总倾角10°、角速20°/s、高差0.20m、垂直/水平速度0.25m/s，连续0.50s且2个新测距。
  detach_range_height_tolerance_m: 0.10
  detach_range_speed_tolerance_mps: 0.20
  detach_range_stable_time_s: 1.0
  detach_range_stable_min_samples: 4
  # 已安装 MicoAir MTF-02P，操作员于 2026-10-21 确认。
  # 厂家标称量程：反射率 90%、照度 7 万勒克斯时为 0.02～6 米；不保证实际测量质量。
  # 厂家说明：https://micoair.cn/zh/docs/sensors/sensors/mtf-02-02p-sensors
  detach_range_min_distance_m: 0.02
  detach_range_max_distance_m: 6.0
  detach_range_sensor_axis_body: [0.0, 0.0, -1.0]
  # 从传感器指向受控参考点的机体前左上坐标系向量；仅投影一次到世界坐标系的竖直轴。
  detach_range_reference_offset_body_m: [0.0, 0.0, 0.0]
  # 操作员已确认传感器朝下安装；距离值为沿传感器轴线的原始测距。
  # 偏移量为零时，以传感器原点作为参考点。
  detach_range_geometry_confirmed: true
  detach_range_future_tolerance_s: 0.10
  detach_range_height_filter_tau_s: 0.10
  detach_range_velocity_filter_tau_s: 0.25
  # 使用相邻测距样本计算的快速速度，为所有由雷达测距控制的脱离／恢复路径提供阻尼。
  # 慢速窗口仍独立用于定高稳定性／控制权交接检查，不限制姿态回平完成。
  detach_range_fast_velocity_filter_tau_s: 0.10
  detach_range_fast_velocity_max_gap_s: 0.60
  detach_range_jump_m: 0.25
  detach_range_max_vertical_speed_mps: 2.0
  # 兼容字段：输出必须新鲜且归本节点所有，不再另外启动0.3秒同步倒计时。
  detach_range_output_sync_timeout_s: 0.30
  return_thrust_slew_per_s: 0.50
  recovery_horizontal_velocity_ki: 0.30
  recovery_horizontal_integral_limit_mps2: 0.20
  # 普通恢复重新接入时平滑过渡；不延迟紧急回平或急停。
  recovery_horizontal_reentry_blend_s: 0.30
  # 仅同一有效反馈周期内的短暂软暂停可使用快速接入；硬失效仍完整确认。
  recovery_horizontal_soft_reentry_blend_s: 0.15
  recovery_horizontal_soft_pause_max_s: 0.75
  # 对于已经通过准入且持续有效的反馈，角速度从 30 度／秒增加到现有的
  # 45 度／秒上限时，将修正量逐渐降至零；高角速度时不重新准入。
  recovery_horizontal_rate_soft_deg_s: 30.0
  # 按实测倾角提前减弱速度修正；原有大于 10 度的检查阈值保持不变。
  recovery_horizontal_tilt_soft_deg: 5.0
  recovery_horizontal_tilt_stop_deg: 8.0
  # 倾角达到或超过 8 度后，须取得新鲜、接近水平且低角速度的样本，才平滑重新接入。
  recovery_horizontal_level_hold_s: 0.30
  departure_retreat_speed_mps: 0.05
  # 固定接管前航向，前向速度主要通过俯仰控制；侧向只做独立弱阻尼。
  departure_lateral_velocity_kp: 0.50
  # 相对可信悬停横滚基准的修正上限；总倾角仍受原5°及最终mux约束。
  departure_roll_correction_deg: 2.0
  # 候选横滚目标变化率，不代表实测机体角速度上限。
  departure_roll_rate_deg_s: 1.0
  departure_clearance_distance_m: 0.50
  departure_clearance_hold_s: 0.30
  departure_heading_tolerance_deg: 10.0
  # 垂直目标速度限幅，世界东-北-天坐标系中向上为正。正常脱离使用
  # 捕获的支撑推力基准及独立比例积分控制器，并持续到控制权交接。
  recovery_max_up_speed_mps: 0.10
  recovery_max_down_speed_mps: 0.15
  recovery_height_to_speed_kp: 0.50
  recovery_velocity_kp: 0.30
  recovery_positive_compensation_max: 0.08
  recovery_max_thrust: 0.60
  # 仅用于台架脱离／恢复支撑；退出阶段仍保留，直到飞控进入定高模式。
  bench_detach_hover_thrust: 0.48
  # 脱离开始时记录里程计高度。机体回平过程中，使用高度／垂直速度反馈
  # 及实测倾角，计算所需的垂直悬停推力分量。
  # 车轮沿墙滚动时保持压墙推力。倾角接近 90 度时，
  # 必须由车轮摩擦力承重；推力受 max_thrust 参数限制。
  detach_altitude_kp: 0.50
  detach_vertical_speed_kd: 0.30
  detach_compensation_start_deg: 80.0
  # 保持在恢复阶段，直到高度和垂直速度均稳定。
  detach_altitude_tolerance_m: 0.10
  detach_vertical_speed_tolerance_mps: 0.20

  # 正俯仰方向与 pitch_45_test.py 已验证的方向一致。
  # 仅正 45 度经过台架测试；正 90 度目标仍待验证。
  wall_angle_deg: 90.0
  # 慢速接近一开始就向墙倾斜3°，不再先做翻转前悬停稳定阶段。
  approach_pitch_deg: 3.0
  # 控制台启动时启用融合速度。正常脱离要求已冻结的
  # 平衡姿态／航向；旧版台架脱离保留独立路径。
  horizontal_velocity_enabled: false
  horizontal_approach_speed_mps: 0.10
  # 接近阶段继承从位置控制模式接管时的实际总推力；恢复阶段保留独立基准。
  approach_use_takeover_thrust: true
  horizontal_velocity_kp: 1.5
  # 接近阶段在世界东-北-天坐标系中积分；恢复阶段使用独立重置的比例积分控制器实例。
  horizontal_velocity_ki: 0.30
  horizontal_integral_limit_mps2: 0.20
  horizontal_equilibrium_window_s: 0.5
  horizontal_equilibrium_speed_mps: 0.20
  # 围绕已冻结的位置控制模式平衡姿态叠加反馈增量；最终总倾角锥仍限制为 5 度。
  horizontal_max_acceleration_mps2: 0.30
  horizontal_target_acceleration_mps2: 0.10
  horizontal_flow_timeout_s: 0.60
  # MAVROS 时钟映射可能略领先于 ROS；未来时间容差的硬上限为 0.10 秒。
  horizontal_flow_future_tolerance_s: 0.10
  horizontal_flow_quality_min: 1
  horizontal_reacquire_time_s: 0.30
  horizontal_resume_tilt_deg: 10.0
  horizontal_stable_speed_mps: 0.10
  horizontal_stable_time_s: 1.0
  # 2026-09-22 ULog：翻转前约0.47，翻转实际四电机均值约0.616。
  hover_thrust: 0.49
  approach_thrust: 0.47
  flip_thrust_multiplier: 1.35
  hold_thrust_multiplier: 1.50
  # 贴墙距离仍偏大时，以0.03/s从翻转/保持值增加，最高0.75；恢复接触后
  # 以0.05/s回到名义保持值0.735（0.49 × 1.5）。不要复制ACRO日志中饱和的0.89指令。
  wall_pressure_ramp_up_per_s: 0.03
  wall_pressure_ramp_down_per_s: 0.05
  wall_pressure_max_thrust: 0.75
  recover_thrust_multiplier: 1.10
  # ROS/MAVROS总推力请求上限。日志中单电机曾达到1.0，因此先降额到0.85；
  # 真正的单电机硬上限仍须在PX4控制分配器或ESC内实现。
  max_thrust: 0.85

  # 有时间预算限制的脱离支撑；确认和混合过渡均消耗该预算。
  detach_height_continuation_jump_m: 0.25
  detach_height_continuation_entry_tilt_deg: 30.0
  detach_height_continuation_episode_s: 1.2
  detach_height_continuation_total_s: 1.5
  detach_height_continuation_confirm_s: 0.30
  detach_height_continuation_min_samples: 4
  detach_height_continuation_max_gap_s: 0.20
  detach_height_continuation_step_residual_m: 0.05
  detach_height_continuation_residual_rate_mps: 0.20
  detach_height_continuation_restore_tilt_deg: 10.0
  detach_height_continuation_restore_speed_mps: 0.20
  detach_height_continuation_blend_s: 0.30

  max_rate_rps: 3.0
  flip_max_rate_rps: 6.0
  capture_max_rate_rps: 4.5
  recover_max_rate_rps: 3.0
  max_down_velocity_mps: 0.80
  # 仅在确认贴墙接触后，才忽略估计下降速度限制。
  ignore_down_velocity_during_hold: true
  min_altitude_m: 0.30
  # 地面上的本地东-北-天坐标系高度可能漂移到零以下；解锁时冻结地面高度。
  altitude_reference: arming_ground
  recover_angle_deg: 15.0
  sensor_timeout_s: 0.60
  # 按操作员要求，仅在贴墙保持阶段绕过距离失效检查；不发送伪造的距离或有效标志。
  # 取得控制权、翻转、接触确认、脱离和恢复阶段仍保留距离检查。
  ignore_range_loss_during_hold: true
  # 仅在最后一帧有效测距仍新鲜时，容忍错误码 258。
  ignore_range_error_258: true
  # 接近、接管、翻转、接触确认和贴墙保持期间，忽略测距无效／丢失。
  # 接近／接管阶段推进前，仍须等待新鲜有效的前向／顶部测距。
  ignore_range_loss_during_attachment: true
  sensor_health_timeout_s: 0.30
  # 侧吸取得 owner 前要求顶部传感器已有新鲜有效量测。
  require_top_sensor_on_acquire: true
  odom_timeout_s: 0.50
  # 按消息约定，nav_msgs/Odometry.twist 的速度量使用 child_frame_id 指定的子坐标系。
  odom_twist_in_child_frame: true
  state_timeout_s: 1.50
  operator_timeout_s: 0.50
  range_filter_alpha: 0.30
  require_armed: true
  require_offboard: true

  # PX4 参考实现在墙面锁定阶段绕过混控器，直接写入原始电机输出。
  # 此 MAVROS 移植版本默认使用受限的姿态／推力目标。
  pin_enabled: false
  pin_pitch_deg: 85.0
  pin_thrust: 0.85
  pin_hold_s: 0.0
