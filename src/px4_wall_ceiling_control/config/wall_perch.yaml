# ROS port of the external PX4 wall_perch reference module. These are
# bench-test initial values, not flight-qualified gains or limits.
wall_perch_decision_node:
  decision_enabled: false

  front_range_topic: /sensor/front/range
  top_range_topic: /sensor/ceiling/range
  sensor_health_topic: /sensor/health
  odom_topic: /mavros/local_position/odom
  state_topic: /mavros/state
  operator_topic: /operator/command
  detach_topic: /wall_perch/detach
  cancel_topic: /wall_perch/cancel
  status_topic: /wall_perch/status
  control_candidate_topic: /wall_perch/control_candidate
  publish_rate_hz: 50.0

  # WP_FRN_RD_DIST / WP_FRN_RD_HLD
  front_ready_distance_m: 0.50
  # 前距连续满足0.4 s后直接进入SLOW_APPROACH。
  front_ready_hold_s: 0.40
  # WP_FLP_TRD_DIST / WP_FLP_TRD_HLD
  flip_trigger_distance_m: 0.20
  flip_trigger_hold_s: 0.30
  # WP_TOP_CT_DIST / WP_TOP_CT_HLD
  top_contact_distance_m: 0.056
  # 保留为HOLD后的接触诊断；进入HOLD不再等待连续近距确认。
  top_contact_hold_s: 1.00
  top_clear_distance_m: 0.10
  top_clear_hold_s: 0.50
  # 翻转后顶部雷达成为贴墙压力反馈：距离偏大时增推，恢复后回到名义保持值。
  wall_pressure_target_distance_m: 0.05
  wall_pressure_tolerance_m: 0.01

  # 正常流程跳过STABILIZE_HOVER；保留参数仅用于旧状态兼容。
  stabilize_time_s: 0.00
  # Valid raw front distance above this limit aborts pre-flip approach.
  approach_abort_front_distance_m: 1.3
  approach_timeout_s: 20.00
  flip_time_s: 2.00
  # Independent wall-clock limit: bounded control steps never catch up after stalls.
  flip_duration_timeout_s: 4.00
  # Bound target lead over fresh measured attitude; height braking remains active.
  flip_max_tracking_error_deg: 15.0
  # 最后10%才接入顶部雷达：2秒翻转从1.8秒起，一帧新鲜有效测距即进入HOLD。
  flip_top_start_fraction: 0.90
  capture_time_s: 0.50
  # Safety input failures still abort immediately; these are phase limits only.
  capture_timeout_s: 8.00
  # Remain against the wall until the operator stops the wheels and requests detach.
  hold_time_s: 0.00
  # Keep bounded wall pressure during slip/wheel correction; only a manual
  # detach request advances after the normal pose/rate stability gates pass.
  # Enabled after the existing final-flip valid top-frame gate; not before it.
  manual_wall_recovery_enabled: true
  hold_entry_blend_s: 0.50
  # Detach admission requires stable measured pose and bounded vertical speed.
  # The trajectory starts from the last actual published attitude/thrust.
  detach_axis_error_deg: 15.0
  detach_max_rate_rps: 0.436332313  # 25 deg/s
  detach_vertical_speed_check_enabled: false  # Ignore speed magnitude for detach admission.
  detach_max_abs_vertical_speed_mps: 0.20
  detach_stable_hold_s: 0.50
  detach_request_timeout_s: 8.00
  # Detach attitude trajectory duration.
  # 90 deg over 3 s (quintic setpoint).
  detach_time_s: 3.00
  detach_duration_timeout_s: 8.00
  detach_max_tracking_error_deg: 40.0
  detach_recovered_tilt_deg: 5.0
  detach_recovered_rate_deg_s: 10.0
  detach_recovered_hold_s: 0.30
  recover_time_s: 1.00
  recover_timeout_s: 15.00
  # Keep one departure height/base through DETACH, RECOVER and handover.
  detach_height_kp: 0.50
  detach_velocity_kp: 0.30
  detach_velocity_ki: 0.12
  detach_vertical_integral_limit: 0.06
  detach_vertical_correction_limit: 0.12
  detach_support_max_thrust: 0.85
  return_thrust_slew_per_s: 0.50
  recovery_horizontal_velocity_ki: 0.30
  recovery_horizontal_integral_limit_mps2: 0.20
  departure_retreat_speed_mps: 0.05
  departure_clearance_distance_m: 0.30
  departure_clearance_hold_s: 0.30
  departure_heading_tolerance_deg: 10.0
  # Vertical target-speed limits; ENU up is positive. Normal departure uses
  # its captured support base and independent PI through handover.
  recovery_max_up_speed_mps: 0.10
  recovery_max_down_speed_mps: 0.15
  recovery_height_to_speed_kp: 0.50
  recovery_velocity_kp: 0.30
  recovery_positive_compensation_max: 0.08
  recovery_max_thrust: 0.60
  # Bench departure/recovery support only; retain through EXIT until ALTCTL.
  bench_detach_hover_thrust: 0.48
  # Capture odometry Z when detach starts. As the body levels, use Z/vertical
  # speed feedback and measured tilt to request the vertical hover component.
  # Keep the wall-pressure thrust while the wheels roll on the wall. Near 90 deg,
  # wheel friction must support weight; thrust is capped at max_thrust.
  detach_altitude_kp: 0.50
  detach_vertical_speed_kd: 0.30
  detach_compensation_start_deg: 80.0
  # Remain in RECOVER until both height and vertical speed settle.
  detach_altitude_tolerance_m: 0.10
  detach_vertical_speed_tolerance_mps: 0.20

  # Positive pitch matches the direction verified by pitch_45_test.py.
  # Only +45 deg has been bench tested; the +90 deg target still needs validation.
  wall_angle_deg: 90.0
  # 慢速接近一开始就向墙倾斜3°，不再先做翻转前悬停稳定阶段。
  approach_pitch_deg: 3.0
  # Console launch enables fused velocity. Normal departure requires its frozen
  # equilibrium/heading; legacy bench departure retains its separate path.
  horizontal_velocity_enabled: false
  horizontal_approach_speed_mps: 0.10
  # Approach retains the actual POSCTL collective at takeover; recovery keeps its own base.
  approach_use_takeover_thrust: true
  horizontal_velocity_kp: 1.5
  # Approach ENU integral. Recovery uses its own separately reset PI instance.
  horizontal_velocity_ki: 0.30
  horizontal_integral_limit_mps2: 0.20
  horizontal_equilibrium_window_s: 0.5
  horizontal_equilibrium_speed_mps: 0.10
  # Feedback increment around the frozen POSCTL equilibrium; final total cone remains 5deg.
  horizontal_max_acceleration_mps2: 0.30
  horizontal_target_acceleration_mps2: 0.10
  horizontal_flow_timeout_s: 0.60
  # MAVROS clock mapping may lead ROS slightly; cap is enforced at 0.10 s.
  horizontal_flow_future_tolerance_s: 0.10
  horizontal_flow_quality_min: 1
  horizontal_reacquire_time_s: 0.30
  horizontal_resume_tilt_deg: 10.0
  horizontal_stable_speed_mps: 0.10
  horizontal_stable_time_s: 1.0
  # 2026-09-22 ULog：翻转前约0.47，翻转实际四电机均值约0.616。
  hover_thrust: 0.49
  approach_thrust: 0.47
  flip_thrust_multiplier: 1.35
  hold_thrust_multiplier: 1.50
  # 贴墙距离仍偏大时，以0.03/s从翻转/保持值增加，最高0.75；恢复接触后
  # 以0.05/s回到名义保持值0.735（0.49 × 1.5）。不要复制ACRO日志中饱和的0.89指令。
  wall_pressure_ramp_up_per_s: 0.03
  wall_pressure_ramp_down_per_s: 0.05
  wall_pressure_max_thrust: 0.75
  recover_thrust_multiplier: 1.10
  # ROS/MAVROS总推力请求上限。日志中单电机曾达到1.0，因此先降额到0.85；
  # 真正的单电机硬上限仍须在PX4控制分配器或ESC内实现。
  max_thrust: 0.85

  # Bounded departure support; verification and blending both consume budget.
  detach_height_continuation_jump_m: 0.25
  detach_height_continuation_entry_tilt_deg: 30.0
  detach_height_continuation_episode_s: 1.2
  detach_height_continuation_total_s: 1.5
  detach_height_continuation_confirm_s: 0.30
  detach_height_continuation_min_samples: 4
  detach_height_continuation_max_gap_s: 0.20
  detach_height_continuation_step_residual_m: 0.05
  detach_height_continuation_residual_rate_mps: 0.20
  detach_height_continuation_restore_tilt_deg: 10.0
  detach_height_continuation_restore_speed_mps: 0.20
  detach_height_continuation_blend_s: 0.30

  max_rate_rps: 3.0
  flip_max_rate_rps: 6.0
  capture_max_rate_rps: 4.5
  recover_max_rate_rps: 3.0
  max_down_velocity_mps: 0.80
  # Ignore estimated descent limit only after wall contact is confirmed.
  ignore_down_velocity_during_hold: true
  min_altitude_m: 0.30
  # Local ENU z can drift below zero on the ground; freeze ground z on arming.
  altitude_reference: arming_ground
  recover_angle_deg: 15.0
  sensor_timeout_s: 0.60
  # Operator-requested hold-only bypass. No synthetic range/validity is sent.
  # Acquisition, flip, capture, detach and recovery retain their range checks.
  ignore_range_loss_during_hold: true
  # Tolerate error 258 only while the last valid range is still fresh.
  ignore_range_error_258: true
  # Ignore range invalid/loss during approach, takeover, flip, capture and hold.
  # Approach/takeover still wait for fresh valid front/top ranges before advancing.
  ignore_range_loss_during_attachment: true
  sensor_health_timeout_s: 0.30
  # 侧吸取得 owner 前要求顶部传感器已有新鲜有效量测。
  require_top_sensor_on_acquire: true
  odom_timeout_s: 0.50
  # nav_msgs/Odometry.twist is expressed in child_frame_id by convention.
  odom_twist_in_child_frame: true
  state_timeout_s: 1.50
  operator_timeout_s: 0.50
  range_filter_alpha: 0.30
  require_armed: true
  require_offboard: true

  # PX4 reference bypasses the mixer and writes raw motors in WALL_PIN.
  # This MAVROS port deliberately defaults to a bounded attitude/thrust target.
  pin_enabled: false
  pin_pitch_deg: 85.0
  pin_thrust: 0.85
  pin_hold_s: 0.0
