<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2e644b"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icon-192.png"><link rel="icon" href="/icon.svg"><title>连接 · ceiling_wall_console</title><link rel="stylesheet" href="/style.css"><script src="/login.js" defer></script></head>
<body><main class="login"><div class="eyebrow">CEILING + WALL / 多设备应用</div><h1>连接 ceiling_wall_console</h1><p>电脑、平板和手机共用同一测试台。</p><section class="panel"><h2>输入访问码</h2><p id="offlineLoginHint" class="muted" hidden></p><p><a href="/connect">选择其他控制台 IP</a></p><form id="loginForm"><label for="deviceLabel">设备名称</label><input id="deviceLabel" name="label" maxlength="32" placeholder="例如：飞手手机" autocomplete="nickname" required><label for="accessCode">测试台访问码</label><input id="accessCode" name="code" type="password" autocomplete="current-password" required minlength="4"><button id="loginButton" type="submit">进入测试台</button></form><p id="loginMessage" role="status" aria-live="polite"></p></section><p class="muted">登录后以观察端进入。申请控制权后才能操作，同一时间只有一个设备能控制。</p><p class="muted">请连接测试台所在的可信网络。可通过浏览器菜单添加到主屏幕；此应用需要持续联网。</p></main></body></html>
